<section class="hero-banner">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-7">
        <span class="badge bg-danger mb-3">NOVA COLEÇÃO</span>
        <h1 class="hero-title">ELEVE SEU<br><span class="text-danger">NÍVEL</span></h1>
        <p class="hero-subtitle">Os melhores tênis das marcas Nike, Adidas, Puma e mais. Performance e estilo em um só lugar.</p>
        <a routerLink="/busca" [queryParams]="{ nome: 'nike' }" class="btn btn-sh-primary btn-lg me-2">Explorar</a>
        <a routerLink="/carrinho" class="btn btn-sh-outline btn-lg text-white border-white">Meu Carrinho</a>
      </div>
    </div>
  </div>
</section>
