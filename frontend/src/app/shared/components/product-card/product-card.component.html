<div class="card card-produto h-100">
  <img [src]="produto.imagem" [alt]="produto.nome" class="card-img-top" loading="lazy">
  <div class="card-body d-flex flex-column">
    <span class="text-muted small text-uppercase">{{ produto.marca }}</span>
    <h5 class="card-title">{{ produto.nome }}</h5>
    <p class="preco mt-auto mb-3">{{ produto.preco | currency:'BRL' }}</p>
    <a [routerLink]="['/produto', produto.id]" class="btn btn-sh-primary w-100">Ver Detalhes</a>
  </div>
</div>
