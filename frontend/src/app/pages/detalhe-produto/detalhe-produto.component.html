<div class="container py-4 pb-5">
  <div *ngIf="carregando" class="text-center py-5">
    <div class="spinner-border text-danger"></div>
  </div>

  <div class="row g-4" *ngIf="produto && !carregando">
    <div class="col-md-6">
      <img [src]="produto.imagem" [alt]="produto.nome" class="img-detalhe rounded">
    </div>
    <div class="col-md-6">
      <span class="badge bg-secondary mb-2">{{ produto.marca }}</span>
      <h1 class="detalhe-titulo">{{ produto.nome }}</h1>
      <p class="text-muted">{{ produto.categoria }}</p>
      <p class="preco-detalhe">{{ produto.preco | currency:'BRL' }}</p>
      <p class="descricao">{{ produto.descricao }}</p>
      <p><strong>Estoque:</strong> {{ produto.estoque }} unidades</p>

      <div class="d-flex align-items-center gap-3 my-4">
        <label class="fw-semibold">Quantidade:</label>
        <div class="input-group qty-group" style="max-width: 140px;">
          <button class="btn btn-outline-dark" type="button" (click)="diminuir()">-</button>
          <input type="number" class="form-control text-center" [(ngModel)]="quantidade" [max]="produto.estoque" min="1" readonly>
          <button class="btn btn-outline-dark" type="button" (click)="aumentar()">+</button>
        </div>
      </div>

      <button class="btn btn-sh-primary btn-lg" (click)="adicionarCarrinho()" [disabled]="produto.estoque === 0">
        Adicionar ao Carrinho
      </button>
      <a routerLink="/carrinho" class="btn btn-sh-outline btn-lg ms-2">Ver Carrinho</a>

      <div class="alert alert-success mt-3" *ngIf="mensagem">{{ mensagem }}</div>
    </div>
  </div>
</div>
